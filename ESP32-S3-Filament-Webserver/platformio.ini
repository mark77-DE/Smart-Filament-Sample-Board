[platformio]
default_envs = esp32, esp32-s3, esp32-ssd1306

[env]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps = 
  Adafruit PN532
  Adafruit SSD1306
  Adafruit SH110X
  Adafruit GFX Library
  Adafruit NeoPixel
  tzapu/WiFiManager @ ^2.0.5
  https://github.com/me-no-dev/AsyncTCP.git
  https://github.com/me-no-dev/ESPAsyncWebServer.git
  bblanchon/ArduinoJson@^7.4.2
  knolleary/PubSubClient
board_build.filesystem = littlefs

extra_scripts = pre:tools/git_version.py , pre:scripts/gzip_asset.py
build_flags =    ; <-- leer lassen

[env:esp32]
board_build.flash_mode = dio
board_build.f_flash = 40000000L
board_build.partitions = partitions_ota_littlefs_esp32dev.csv
build_flags = 
  ${env.build_flags}
  -D MQTT_MAX_PACKET_SIZE=1024
  -DBOARD_VARIANT="\"dev-kit-v1\""

[env:esp32-ssd1306]
build_flags =
  ${env.build_flags}
  -DDISPLAY_TYPE=DISPLAY_TYPE_SSD1306
  -D MQTT_MAX_PACKET_SIZE=1024


[env:esp32-s3]
board = esp32-s3-devkitc-1
board_upload.flash_size = 4MB
board_build.flash_size = 4MB
board_build.flash_mode = dio
board_build.f_flash = 80000000L
board_build.partitions = partitions_ota_littlefs_esp32s3.csv
monitor_filters = esp32_exception_decoder

build_flags = ${env.build_flags} 
  -DSDA_PIN=13
  -DSCL_PIN=12
  -DPN532_SCK=3
  -DPN532_MISO=4
  -DPN532_MOSI=5
  -DPN532_CS=6
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DARDUINO_USB_MODE=1
  -D MQTT_MAX_PACKET_SIZE=1024
  -DBOARD_VARIANT="\"esp32-s3-supermini\""



