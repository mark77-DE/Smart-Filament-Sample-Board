<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>Spot My Filament - Dashboard</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="header">
        <div id="logo">
            <img src="/logo.png" alt="Logo" class="logo">
        </div>
        <div id="headline">
            Spot My Filament
            <div id="subheadline">Smart Filament Sample Board</div>
        </div>
        <div id="adminBtn">
            <button onclick="window.location.href='/settings'">
                Settings
            </button>
        </div>
        <div id="wsStatus">unknown</div>
</div>

<div id="filamentGrid" class="grid-container">
  <!-- Kacheln werden hier per JS eingefügt -->
</div>

<div id="about">
        <span id="fwVersion" class="version"></span>
        <span id="gitHash" class="version"></span>
        <span id="build_date" class="version"></span>
</div>

<script src="script.js"></script>
</body>
</html>
