<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8">
    <title>Spot My Filament - OTA Update</title>
    <link rel="stylesheet" href="/update.css">
</head>
<body>
    
    <div id="header">
        <div id="logo">
            <img src="/logo.png" alt="Logo" class="logo">
        </div>
        <div id="headline">
            Spot My Filament - Update
            <div id="subheadline">Smart Filament Sample Board - OTA Update</div>
        </div>
    </div>

<div id="export">
    <div class="exportHint">Bevor doing <span class="alert">firmware</span> updates, please export settings, because data <span class="alert">might</span> be lost.</div>
    <div class="exportHint">Bevor doing <span class="alert">filesystemt</span> updates, please export settings, because data <span class="alert">will</span> be lost.</div>
    <!-- Export -->
    <button id="exportAllBtn">Export</button>
</div>
  

<div id="fwUpdateSection">
    <div class="updateHeader">Firmware Update</div>
    <form id="uploadForm">
        <label for="firmwareFile" id="uploadLabel" class="upload-btn">Choose file</label>
        <input type="file" id="firmwareFile" accept="firmware.bin"/>
        <button type="button" onclick="uploadFirmware()">Upload FW</button>
    </form>
</div>


<div id="fsUpdateSection">
    <div class="updateHeader">Filesystem Update</div>
    <form id="uploadFSForm">
        <label for="fsFile" id="uploadLabel" class="upload-btn">Choose file</label>
        <input type="file" id="fsFile" accept="littlefs.bin"/>
        <button type="button" onclick="uploadFS()">Upload FS</button>
    </form>
</div>

<pre id="status"></pre>

<div class="sysGroup">
            <button onclick="window.location.href='/'">
                Dashboard
            </button>
        </div>

        <div class="sysGroup">
            <button onclick="window.location.href='/settings.html'">
                Settings
            </button>
        </div>

<script src="/update.js"></script>
</body>
</html>
