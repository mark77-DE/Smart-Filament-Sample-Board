<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>Filament DB Admin</title>
<link rel="stylesheet" href="/admin.css">
</head>
<body>
<h1>Filament DB</h1>

<h3>Einträge</h3>
<div id="db"></div>

<h3>Neuen Eintrag</h3>
<form id="addForm">
  <input type="text" name="uid" placeholder="UID (z. B. 04:...)" required>
  <input type="text" name="vendor" placeholder="Hersteller" required>
  
  <!-- Filament Typ als Dropdown -->
  <select name="type" required>
    <option value="">-- Typ wählen --</option>
    <option value="PLA">PLA</option>
    <option value="PLA+">PLA+</option>
    <option value="PLA-CF">PLA-CF</option>
    <option value="PETG">PETG</option>
    <option value="PETG-CF">PETG-CF</option>
    <option value="ABS">ABS</option>
    <option value="ASA">ASA</option>
    <option value="TPU">TPU</option>
    <option value="Nylon">Nylon</option>
    <option value="Holz">Holz-Filament</option>
  </select>

  <input type="text" name="color" placeholder="Farbe" required>
  <input type="number" name="ledIndex" placeholder="LED Index" required>
  <button type="submit">Hinzufügen</button>
</form>

<a href="/api/export" download="filaments.json">Export</a>

<h3>Import</h3>
<form id="uploadForm" enctype="multipart/form-data">
    <input type="file" name="file" required>
    <button type="submit">Upload</button>
</form>

<script src="/admin.js"></script>
</body>
</html>
