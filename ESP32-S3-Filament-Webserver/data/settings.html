<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8">
    <title>Spot My Filament - Config Page</title>
    <link rel="stylesheet" href="/settings.css">
</head>

<body>
    <div id="header">
        <div id="logo">
            <img src="/logo.png" alt="Logo" class="logo">
        </div>
        <div id="headline">
            Spot My Filament
            <div id="subheadline">Smart Filament Sample Board</div>
        </div>
    </div>

    <div id="systemSection">

        <div class="sysGroup">
            <button onclick="window.location.href='/'">
                Dashboard
            </button>
        </div>

        <div class="sysGroup">

            <div id="toggle">
             <label class="edit-toggle">
                    <input type="checkbox" id="editToggle">
                    <span class="slider"></span> edit
                </label>
            </div>
        </div>

        <div class="sysGroup">

            <div id="debug">
             <label class="debug-toggle">
                    <input type="checkbox" id="debugToggle">
                    <span class="slider"></span> debug
                </label>
            </div>
        </div>

        <div class="sysGroup">
            <button id="saveConfig" >Save Config</button>
        </div>


        <!-- System Control -->
        <div class="sysGroup">
            <button id="rebootBtn">Reboot</button>
        </div>

        <!-- Export / Import -->
        <div class="sysGroup">

            <!-- Export -->
            <button id="exportAllBtn">Export</button>

        </div>

        <!-- Export / Import -->
        <div class="sysGroup">

            <!-- Import -->
            <form id="importAllForm" method="POST" enctype="multipart/form-data">

                <!-- Stylbarer Upload-Button -->
                <label for="importFile" id="uploadLabel" class="upload-btn">Choose file</label>
                <input type="file" id="importFile" name="file" accept=".json" required hidden>

                <!-- Import starten -->
                <button id="importBtn" type="submit" hidden>Import</button>

            </form>

        </div>
    

    
    

    <div id="wsStatus" class="ws-status ws-disconnected">WebSocket: getrennt</div>

    </div>

    </div>

    <!--  Settings -->
    <div id="sectionSettings">

        <!-- add item -->

        <div id="addEntry" class="card">
            <div class="cardHeader">Neuen Eintrag</div>

            <form id="addForm" class="formGrid">

                <label for="uid">UID:</label>
                <input type="text" name="uid" placeholder="UID (z. B. 04:...)" required>

                <label for="vendor">Name:</label>
                <input type="text" name="vendor" placeholder="Name" required>

                <label for="type">Filament Typ:</label>
                <select name="type" required>
                    <option value="">-- Typ wählen --</option>
                    <option value="PLA">PLA</option>
                    <option value="PLA+">PLA+</option>
                    <option value="PLA-CF">PLA-CF</option>
                    <option value="PLA-Matte">PLA-Matte</option>
                    <option value="PETG">PETG</option>
                    <option value="PETG-CF">PETG-CF</option>
                    <option value="ABS">ABS</option>
                    <option value="ASA">ASA</option>
                    <option value="TPU">TPU</option>
                    <option value="Nylon">Nylon</option>
                    <option value="Holz">Holz-Filament</option>
                </select>

                <label for="color">Farbe:</label>
                <input type="text" name="color" placeholder="Farbe" required>

                <label for="ledIndexSelect">LED:</label>
                <select name="ledIndex" id="ledIndexSelect" required></select>

                <!-- Button über beide Spalten -->
                <div style="grid-column: span 2;">
                    <button id="addBtn" type="submit" class="primaryBtn">Hinzufügen</button>
                </div>

            </form>
        </div>


        <!-- LED Settings -->

        <div id="ledSettings" class="card">
            <div class="cardHeader">LED Settings</div>

            <div class="formGrid">

                <label for="maxLED">Number of LEDs (1–100):</label>
                <input type="number" id="maxLED" name="maxLED" min="1" max="100" value="8">

                <label for="ledBrightness">Brightness (%):</label>
                <input type="number" id="ledBrightness" name="ledBrightness" min="0" max="255" value="50">

                <label for="ledPin">LED Pin:</label>
                <select id="ledPin" name="ledPin">
                    <option value="2">2</option>
                    <option value="4">4</option>
                    <option value="5">5</option>
                    <option value="12">12</option>
                    <option value="14">14</option>
                    <option value="15">15</option>
                    <option value="16">16</option>
                    <option value="17">17</option>
                </select>

                <label for="ledColor" title="Format: #RRGGBB">LED Color:</label>
                <div class="hexField">
                    <input type="text" id="ledColor" name="ledColor" value="#ff0000" maxlength="7" pattern="^#([0-9a-fA-F]{6})$" title="Format: #RRGGBB" placeholder="#RRGGBB">
                    <div class="colorPresets" data-target="ledColor"></div>
                </div>

                <label for="ledTimeout">LED Timeout (ms):</label>
                <input type="number" id="ledTimeout" name="ledTimeout" min="500" max="30000" value="500">


            </div>

        </div>

        <!-- NFC LED Settings -->

        <div id="nfcLedSettings" class="card">
            <div class="cardHeader">NFC LED Settings</div>
            <div class="formGrid">


                <label for="nfcMaxLED">Number of LEDs (1–100):</label>
                <input type="number" id="nfcMaxLED" name="nfcMaxLED" min="1" max="16" value="8">

                <label for="nfcLedBrightness">Brightness (%):</label>
                <input type="number" id="nfcLedBrightness" name="nfcLedBrightness" min="0" max="255" value="50">

                <label for="nfcLedPin">LED Pin:</label>
                <select id="nfcLedPin" name="nfcLedPin">
                    <option value="2">2</option>
                    <option value="4">4</option>
                    <option value="5">5</option>
                    <option value="12">12</option>
                    <option value="14">14</option>
                    <option value="15">15</option>
                    <option value="16">16</option>
                    <option value="17">17</option>
                </select>



                <label for="nfcLedColorSuccess" title="Format: #RRGGBB">LED Color (NFC-Erkannt):</label>
                <div class="hexField">
                    <input type="text" id="nfcLedColorSuccess" name="nfcLedColorSuccess" value="#ff0000" maxlength="7" pattern="^#([0-9a-fA-F]{6})$" title="Format: #RRGGBB" placeholder="#RRGGBB">
                    <div class="colorPresets" data-target="nfcLedColorSuccess"></div>
                </div>

                <label for="nfcLedColorError" title="Format: #RRGGBB">LED Color (NFC-Error):</label>
                <div class="hexField">
                    <input type="text" id="nfcLedColorError" name="nfcLedColorError" value="#ff0000" maxlength="7" pattern="^#([0-9a-fA-F]{6})$" title="Format: #RRGGBB" placeholder="#RRGGBB">
                    <div class="colorPresets" data-target="nfcLedColorError"></div>
                </div>

                <label for="nfcLedTimeout">LED Timeout (ms):</label>
                <input type="number" id="nfcLedTimeout" name="nfcLedTimeout" min="500" max="30000" value="550">

                <label for="nfcLedColorPulse" title="Format: #RRGGBB">LED Color (Standby-Effekt):</label>
                <div class="hexField">
                    <input type="text" id="nfcLedColorPulse" name="nfcLedColorPulse" value="#0033aa" maxlength="7" pattern="^#([0-9a-fA-F]{6})$" title="Format: #RRGGBB" >
                    <div class="colorPresets" data-target="nfcLedColorPulse"></div>
                </div>

                <label for="nfcLedSuccessBlinkEnabled">NFC-Erkannt blinken aktiv:</label>
                <input type="checkbox" id="nfcLedSuccessBlinkEnabled" name="nfcLedSuccessBlinkEnabled" checked>

                <label for="nfcLedSuccessBlinkCount">Blinken Anzahl:</label>
                <input type="number" id="nfcLedSuccessBlinkCount" name="nfcLedSuccessBlinkCount" min="0" max="10" value="3">

                <label for="nfcLedSuccessBlinkMs">Blinken Intervall (ms):</label>
                <input type="number" id="nfcLedSuccessBlinkMs" name="nfcLedSuccessBlinkMs" min="20" max="2000" step="10" value="150">


            </div>


        </div>

    </div>

    <!-- Database Entries -->

    <div id="db"></div>

    <script src="/settings.js"></script>
</body>

</html>
